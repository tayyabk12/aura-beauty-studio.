        cursor: pointer;
        letter-spacing: 0.08em;

        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        position: relative;
        display: inline-block;
      }

      .creepy-btn__cover {
        background-color: var(--cb-primary5);
        box-shadow: 0 0 0 0.115em var(--cb-black) inset;
        padding: 0.9em 1.55em;
        border-radius: inherit;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        position: relative;
        z-index: 1;
        transform-origin: 1.25em 50%;
        transition:
          background-color var(--cb-trans-dur),
          transform var(--cb-trans-dur) cubic-bezier(0.65, 0, 0.35, 1);
        inset: 0;
      }

      .creepy-btn__eyes {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 0.375em;
        right: 1em;
        bottom: 0.6em;
        height: 0.75em;
        z-index: 0;
        pointer-events: none;
      }

      .creepy-btn__eye {
        animation: cb-eye-blink 3s infinite;
        background-color: var(--cb-gray1);
        border-radius: 50%;
        overflow: hidden;
        width: 0.75em;
        height: 0.75em;
        position: relative;
        display: block;
      }

      .creepy-btn__pupil {
        background-color: var(--cb-black);
        border-radius: 50%;
        display: block;
        position: absolute;
        width: 0.375em;
        height: 0.375em;
        top: 50%;
        left: 50%;
      }

      .creepy-btn:focus-visible {
        outline: 0.1875em solid var(--cb-primary3);
      }

      .creepy-btn:hover .creepy-btn__cover,
      .creepy-btn:focus-visible .creepy-btn__cover {
        background-color: var(--cb-primary6);
        transform: rotate(-12deg);
        transition-timing-function: cubic-bezier(0.65, 0, 0.35, 1.65);
      }

      .creepy-btn.creepy-btn--long .creepy-btn__eyes {
        right: 1.15em;
        bottom: 0.42em;
      }

      .creepy-btn.creepy-btn--long:hover .creepy-btn__cover,
      .creepy-btn.creepy-btn--long:focus-visible .creepy-btn__cover {
        background-color: var(--cb-primary6);
        transform: translateY(-2px) rotate(-3deg);
        transition-timing-function: cubic-bezier(0.65, 0, 0.35, 1.65);
      }

      .creepy-btn:active .creepy-btn__cover,
      .creepy-btn.creepy-btn--long:active .creepy-btn__cover {
        transform: translateY(0) rotate(0);
        transition-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
      }

      @keyframes cb-eye-blink {
        0%,
        92%,
        100% {
          animation-timing-function: cubic-bezier(0.32, 0, 0.67, 0);
          height: 0.75em;
        }
        96% {
          animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1);

        }
      }

      // CreepyButton Component
      function CreepyButton({
        children,
        className = '',
        onClick,
        type = 'button',
        theme = 'roseBronze',
        long = false,
        style = {},
        ...props
      }) {
        const eyesRef = useRef(null);
        const [eyeCoords, setEyeCoords] = useState({ x: 0, y: 0 });

        const translateX = -50 + eyeCoords.x * 50;
        const translateY = -50 + eyeCoords.y * 50;

        const eyeStyle = {
          transform: `translate(${translateX}%, ${translateY}%)`
        };

        const updateEyes = (e) => {
          const userEvent = 'touches' in e && e.touches.length > 0 ? e.touches[0] : e;
          if (!eyesRef.current || !userEvent) return;
          const eyesRect = eyesRef.current.getBoundingClientRect();
          const eyesCenter = {
            x: eyesRect.left + eyesRect.width / 2,
            y: eyesRect.top + eyesRect.height / 2
          };

          const cursor = { x: userEvent.clientX, y: userEvent.clientY };
          const dx = cursor.x - eyesCenter.x;
          const dy = cursor.y - eyesCenter.y;
          const angle = Math.atan2(-dy, dx) + Math.PI / 2;

          const distance = Math.min(Math.hypot(dx, dy), 200);
          const x = (Math.sin(angle) * distance) / 150;
          const y = (Math.cos(angle) * distance) / 100;

          setEyeCoords({ x, y });
        };

        const resetEyes = () => setEyeCoords({ x: 0, y: 0 });
        const themeVars = CB_THEMES[theme] || CB_THEMES.roseBronze;
        const isLongButton = long || className.includes('w-full');

        return (
          <button
            className={`creepy-btn ${isLongButton ? 'creepy-btn--long' : ''} ${className}`}
            type={type}
            onClick={onClick}
            onMouseMove={updateEyes}
            onTouchMove={updateEyes}
            onMouseLeave={resetEyes}
            style={{ ...themeVars, ...style }}
            {...props}
          >
            <span className="creepy-btn__eyes" ref={eyesRef}>
              <span className="creepy-btn__eye">
                <span className="creepy-btn__pupil" style={eyeStyle}></span>
              </span>
              <span className="creepy-btn__eye">
                <span className="creepy-btn__pupil" style={eyeStyle}></span>
              </span>
            </span>
            <span className="creepy-btn__cover">{children}</span>
          </button>
        );
      }

            const totalScrollable = Math.max(1, rect.height - vh);

            const pageProgress = clamp(currentY / docHeight, 0, 1);

            const delta = currentY - lastScrollY;

            smoothedVel = smoothedVel * 0.8 + delta * 0.2;

                          className="w-full h-full object-cover"
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-[#1C1917]/75 via-transparent to-transparent" />
                        <div className="absolute bottom-5 left-5 right-5 flex items-end justify-between gap-3 text-white">
                          <div>
                            <span className="font-mono text-[10px] uppercase tracking-[0.2em] text-white/80 block">
                              AURA BY POOJA • SIGNATURE
                            </span>
                            <p className="font-serif-editorial text-2xl italic">
                              Bridal Makeup &amp; Skin Care
                            </p>
                          </div>
                          <CreepyButton
                            theme="roseBronze"
                            onClick={() =>
                              handleSelectServiceForEnquiry('Bridal Makeup (HD Airbrush & Royal Bridal Couture)')
                            }
                            style={{ fontSize: '0.72rem', minWidth: '8.2em' }}
                          >
                            <span>Book Look</span>
                          </CreepyButton>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* ACT II: MANIFESTO */}
            <section id="act-2" ref={act2Ref} className="py-24 border-b border-[#E6DEC8] bg-[#FAF7F2]">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                  <div className="lg:col-span-7 space-y-6">
                    <span className="font-mono text-xs font-semibold uppercase tracking-[0.22em] text-[#B87D64] block">
                      ACT II — THE ATELIER MANIFESTO
                    </span>
                    <p className="font-serif-editorial text-3xl sm:text-4xl lg:text-[42px] leading-[1.2] text-[#1C1917]">
                      {MANIFESTO_TEXT}
                    </p>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-4">
                      {MANIFESTO_PLATES.map((p, idx) => (
                        <div
                          key={p.id}
                          className={`p-4 rounded-2xl border ${
                            activeManifestoPlateIdx === idx ? 'bg-[#F3EDE4] border-[#B87D64]' : 'bg-[#FAF7F2] border-[#E6DEC8]'
                          }`}
                        >
                          <span className="font-mono text-[10px] font-semibold text-[#B87D64] block">
                            {p.index}
                          </span>
                          <p className="text-xs font-semibold text-[#1C1917] mt-1">{p.title}</p>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="lg:col-span-5">
                    {MANIFESTO_PLATES.map((plate, idx) => {
                      if (idx !== activeManifestoPlateIdx) return null;
                      return (
                        <div key={plate.id} className="rounded-3xl overflow-hidden border border-[#E6DEC8] bg-[#F3EDE4] shadow-xl">
                          <img src={plate.image} alt={plate.title} className="w-full aspect-[4/3] object-cover" />
                          <div className="p-6 space-y-2">
                            <span className="text-xs font-semibold uppercase text-[#B87D64] block">
                              {plate.subtitle}
                            </span>
                            <h3 className="font-serif-editorial text-2xl text-[#1C1917]">{plate.title}</h3>
                            <p className="text-sm text-[#655E57]">{plate.description}</p>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </section>

            {/* ACT III: TRANSFORMATION PEAK */}
            <section id="act-3" ref={act3Ref} className="py-24 bg-[#171412] text-[#FAF7F2] border-y border-[#D49B82]/25">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
                <div className="flex flex-col lg:flex-row lg:items-end justify-between gap-6 mb-8">
                  <div>
                    <span className="font-mono text-[10px] font-semibold uppercase tracking-[0.22em] text-[#D49B82] block mb-2">
                      ACT III — THE SILK VEIL TRANSFORMATION PEAK
                    </span>
                    <h2 className="font-serif-editorial text-3xl sm:text-5xl text-[#FAF7F2]">
                      Witness the <span className="italic text-[#D49B82]">Silk Veil</span> Transformation.
                    </h2>
                  </div>
                  <div className="flex gap-2">
                    {TRANSFORMATION_SHOWCASES.map((item, idx) => (
                      <button
                        key={item.id}
                        onClick={() => {
                          setActiveTransIdx(idx);
                          setManualVeilOverride(null);
                        }}
                        className={`px-4 py-2 rounded-full text-xs font-semibold uppercase tracking-wider ${
                          activeTransIdx === idx
                            ? 'bg-[#D49B82] text-[#171412]'
                            : 'bg-[#26211E] text-[#FAF7F2]/75 border border-[#FAF7F2]/15'
                        }`}
                      >
                        {item.label}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                  <div className="lg:col-span-8">
                    <div
                      ref={veilStageRef}
                      onMouseDown={() => setIsDraggingVeil(true)}
                      onMouseUp={() => setIsDraggingVeil(false)}
                      onMouseMove={(e) => {
                        if (isDraggingVeil || e.buttons === 1) handleVeilPointerMove(e);
                      }}
                      onTouchMove={handleVeilPointerMove}
                      className="relative rounded-3xl overflow-hidden border border-[#D49B82]/35 aspect-[16/10] bg-[#0C0A09] select-none cursor-ew-resize shadow-2xl"
                    >
                      <img src={activeTransItem.afterImage} alt="After" className="w-full h-full object-cover" />
                      <div
                        className="absolute inset-0 overflow-hidden"
                        style={{ clipPath: `inset(0 ${100 - currentVeilRatio * 100}% 0 0)` }}
                      >
                        <img
                          src={activeTransItem.beforeImage}
                          alt="Before"
                          className="w-full h-full object-cover filter saturate-[0.75]"
                        />
                      </div>
                      <div
                        className="absolute top-0 bottom-0 z-20 pointer-events-none"
                        style={{ left: `${currentVeilRatio * 100}%` }}
                      >
                        <div className="w-[2px] h-full bg-[#D49B82] shadow-[0_0_20px_4px_rgba(212,155,130,0.85)]" />
                      </div>
                      <div className="absolute top-4 left-4 z-10 px-3 py-1 rounded-full bg-[#171412]/80 font-mono text-[10px] uppercase">
                        {activeTransItem.beforeLabel}
                      </div>
                      <div className="absolute top-4 right-4 z-10 px-3 py-1 rounded-full bg-[#D49B82] text-[#171412] font-mono text-[10px] font-bold uppercase">
                        {activeTransItem.afterLabel}
                      </div>
                    </div>
                  </div>

                  <div className="lg:col-span-4 space-y-5 bg-[#221E1B] p-6 sm:p-8 rounded-3xl border border-[#D49B82]/25">
                    <span className="font-mono text-[10px] uppercase text-[#D49B82] block">
                      ATELIER TELEMETRY • LIVE
                    </span>
                    <h3 className="font-serif-editorial text-2xl text-[#FAF7F2]">{activeTransItem.serviceMatch}</h3>
                    <p className="text-xs text-[#FAF7F2]/80 leading-relaxed">{activeTransItem.note}</p>
                    <div className="pt-2">
                      <CreepyButton
                        theme="roseBronze"
                        className="w-full"
                        onClick={() => handleSelectServiceForEnquiry(activeTransItem.serviceMatch)}
                      >
                        <span>Book This Transformation</span>
                      </CreepyButton>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* ACT IV: 6 SIGNATURE SERVICES */}
            <section id="act-4" ref={act4Ref} className="py-24 border-b border-[#E6DEC8] bg-[#FAF7F2]">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-12">
                  <div className="lg:col-span-5 space-y-6">
                    <span className="font-mono text-xs font-semibold uppercase tracking-[0.22em] text-[#B87D64] block">
                      ACT IV — OUR 6 SIGNATURE SERVICES
                    </span>
                    <h2 className="font-serif-editorial text-4xl sm:text-5xl text-[#1C1917]">
                      Curated Rituals Ledger
                    </h2>
                    <p className="text-sm text-[#655E57] leading-relaxed">
                      Haircuts, Facials, Hair Spa, Rica Waxing, Airbrush Bridal &amp; Spa Mani-Pedi.
                    </p>
                    <div className="flex flex-wrap gap-2">
                      {SERVICE_CATEGORIES.map((cat) => (
                        <button
                          key={cat.id}
                          onClick={() => setActiveServiceTab(cat.id)}
                          className={`px-4 py-2 rounded-full text-xs font-semibold uppercase ${
                            activeServiceTab === cat.id
                              ? 'bg-[#1C1917] text-[#FAF7F2]'
                              : 'bg-[#F3EDE4] text-[#655E57] border border-[#E6DEC8]'
                          }`}
                        >
                          {cat.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="lg:col-span-7 divide-y divide-[#1C1917]/15 border-t border-b border-[#1C1917]/15">
                    {filteredServices.map((service) => (
                      <div key={service.id} className="py-7 px-4 hover:bg-[#F3EDE4]/50 transition-colors">
                        <div className="flex justify-between items-baseline">
                          <h3 className="font-serif-editorial text-2xl font-medium text-[#1C1917]">
                            {service.name}
                          </h3>
                          <span className="font-serif-editorial text-2xl font-semibold text-[#1C1917]">
                            {service.price}
                          </span>
                        </div>
                        <p className="text-sm text-[#655E57] mt-2 leading-relaxed">{service.description}</p>
                        <div className="mt-4 flex gap-3">
                          <CreepyButton
                            theme="roseBronze"
                            onClick={() => handleSelectServiceForEnquiry(service.name)}
                            style={{ fontSize: '0.75rem' }}
                          >
                            <span>Book Ritual →</span>
                          </CreepyButton>
                          <CreepyButton
                            theme="sage"
                            onClick={() => openWhatsAppWindow(service.name)}
                            style={{ fontSize: '0.74rem' }}
                          >
                            <span>WhatsApp Slot</span>
                          </CreepyButton>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </section>

            {/* ACT V: LOOKBOOK */}
            <section id="act-5" ref={act5Ref} className="py-24 border-b border-[#E6DEC8] bg-[#FAF7F2]">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="mb-8 flex justify-between items-end">
                  <div>
                    <span className="font-mono text-xs font-semibold uppercase tracking-[0.22em] text-[#B87D64] block">
                      ACT V — 35MM LOOKBOOK
                    </span>
                    <h2 className="font-serif-editorial text-3xl sm:text-5xl text-[#1C1917]">
                      Curated Gallery Archive
                    </h2>
                  </div>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                  {LOOKBOOK_ITEMS.map((item) => (
                    <div
                      key={item.id}
                      onClick={() => setSelectedLightboxItem(item)}
                      className="group rounded-2xl overflow-hidden border border-[#E6DEC8] bg-[#1C1917] cursor-pointer shadow-md"
                    >
                      <div className="relative aspect-[4/5] overflow-hidden">
                        <img
                          src={item.image}
                          alt={item.title}
                          className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                        />
                        <div className="absolute inset-0 bg-gradient-to-t from-[#171412]/90 via-[#171412]/20 to-transparent" />
                        <div className="absolute bottom-5 left-5 right-5 text-white">
                          <p className="text-[11px] text-[#D49B82] font-mono mb-1">{item.stylist}</p>
                          <h3 className="font-serif-editorial text-2xl">{item.title}</h3>
                          <p className="text-xs text-white/80 mt-1">{item.caption}</p>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </section>

            {/* LIGHTBOX MODAL */}
            {selectedLightboxItem && (
              <div
                className="fixed inset-0 z-50 bg-[#1C1917]/80 backdrop-blur-sm flex items-center justify-center p-4"
                onClick={() => setSelectedLightboxItem(null)}
              >
                <div
                  className="bg-[#FAF7F2] border border-[#E6DEC8] rounded-3xl max-w-2xl w-full overflow-hidden shadow-2xl p-6"
                  onClick={(e) => e.stopPropagation()}
                >
                  <img
                    src={selectedLightboxItem.image}
                    alt={selectedLightboxItem.title}
                    className="w-full aspect-[16/10] object-cover rounded-2xl mb-4"
                  />
                  <h3 className="font-serif-editorial text-2xl text-[#1C1917]">{selectedLightboxItem.title}</h3>
                  <p className="text-sm text-[#655E57] mt-2">{selectedLightboxItem.caption}</p>
                  <div className="mt-6 flex gap-3">
                    <CreepyButton
                      theme="roseBronze"
                      className="w-full"
                      onClick={() => {
                        handleSelectServiceForEnquiry(selectedLightboxItem.serviceMatch);
                        setSelectedLightboxItem(null);
                      }}
                    >
                      <span>Book This Exact Look</span>
                    </CreepyButton>
                  </div>
                </div>
              </div>
            )}

            {/* ACT VI: BOOKING & MAP */}
            <section id="enquiry-section" ref={act6Ref} className="py-24 bg-[#F3EDE4] border-b border-[#E6DEC8]">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-12">
                  <div className="lg:col-span-5 space-y-6">
                    <span className="font-mono text-xs font-semibold uppercase tracking-[0.22em] text-[#B87D64] block">
                      ACT VI — DIRECT BOOKING &amp; CONCIERGE
                    </span>
                    <h2 className="font-serif-editorial text-4xl sm:text-5xl text-[#1C1917]">
                      Book Your Visit with Pooja.
                    </h2>
                    <p className="text-sm text-[#655E57] leading-relaxed">
                      Instant appointment booking without scanning QR codes. Fast, personal confirmation via WhatsApp or phone call.
                    </p>

                    <div className="p-6 rounded-3xl bg-[#FAF7F2] border border-[#2D6A4F]/30 space-y-4">
                      <h3 className="text-base font-semibold text-[#1C1917]">Direct WhatsApp Desk</h3>
                      <p className="text-xs text-[#655E57]">
                        Message Pooja directly on WhatsApp at {STUDIO_PHONE_DISPLAY} for fast replies.
                      </p>
                      <CreepyButton theme="sage" className="w-full" onClick={() => openWhatsAppWindow(formData.service)}>
                        <span>WhatsApp Pooja (+91 90992 65655)</span>
                      </CreepyButton>
                    </div>

                    <div className="p-6 rounded-3xl bg-[#FAF7F2] border border-[#E6DEC8] space-y-3 text-xs">
                      <p className="font-semibold text-sm text-[#1C1917]">Aura Beauty Studio — By Pooja</p>
                      <p className="text-[#655E57]">{STUDIO_ADDRESS}</p>
                      <p className="text-[#655E57]">Hours: Mon–Sun 10:00 AM – 9:00 PM</p>
                      <div className="rounded-2xl overflow-hidden border border-[#E6DEC8] h-44">
                        <iframe
                          title="Aura Beauty Studio Map"
                          src={STUDIO_MAP_EMBED_URL}
                          className="w-full h-full border-0"
                          loading="lazy"
                        />
                      </div>
                    </div>
                  </div>

                  <div className="lg:col-span-7">
                    <div className="bg-[#FAF7F2] rounded-3xl p-6 sm:p-10 border border-[#E6DEC8]">
                      {submittedRecord ? (
                        <div className="space-y-4 py-4">
                          <h4 className="font-serif-editorial text-3xl text-[#1C1917]">
                            Booking Request Prepared!
                          </h4>
                          <p className="text-xs text-[#655E57]">
                            Thank you, <strong>{submittedRecord.client.fullName}</strong>. Tap below to send your request directly to Pooja on WhatsApp:
                          </p>
                          <CreepyButton theme="sage" className="w-full" onClick={() => openWhatsAppWindow(submittedRecord)}>
                            <span>Send Booking Details on WhatsApp →</span>
                          </CreepyButton>
                          <CreepyButton theme="espresso" className="w-full" onClick={() => setSubmittedRecord(null)}>
                            <span>Book Another Service</span>
                          </CreepyButton>
                        </div>
                      ) : (
                        <form onSubmit={handleFormSubmit} className="space-y-5">
                          <h3 className="font-serif-editorial text-2xl sm:text-3xl text-[#1C1917]">
                            Appointment Request
                          </h3>
                          <div>
                            <label className="block text-xs font-semibold uppercase text-[#1C1917] mb-1">
                              Full Name *
                            </label>
                            <input
                              type="text"
                              name="fullName"
                              value={formData.fullName}
                              onChange={handleInputChange}
                              placeholder="e.g., Ananya Sharma"
                              className="w-full px-4 py-3 rounded-xl bg-[#F3EDE4] border border-[#E6DEC8] text-sm text-[#1C1917]"
                            />
                            {formErrors.fullName && <p className="text-xs text-red-600 mt-1">{formErrors.fullName}</p>}
                          </div>

                          <div>
                            <label className="block text-xs font-semibold uppercase text-[#1C1917] mb-1">
                              Phone / WhatsApp Number *
                            </label>
                            <input
                              type="tel"
                              name="phone"
                              value={formData.phone}
                              onChange={handleInputChange}
                              placeholder="e.g., +91 98200 12345"
                              className="w-full px-4 py-3 rounded-xl bg-[#F3EDE4] border border-[#E6DEC8] text-sm text-[#1C1917]"
                            />
                            {formErrors.phone && <p className="text-xs text-red-600 mt-1">{formErrors.phone}</p>}
                          </div>

                          <div>
                            <label className="block text-xs font-semibold uppercase text-[#1C1917] mb-1">
                              Service Interested In *
                            </label>
                            <select
                              name="service"
                              value={formData.service}
                              onChange={handleInputChange}
                              className="w-full px-4 py-3 rounded-xl bg-[#F3EDE4] border border-[#E6DEC8] text-sm text-[#1C1917]"
                            >
                              {SERVICES_DATA.map((srv) => (
                                <option key={srv.id} value={srv.name}>
                                  {srv.name} ({srv.duration} — {srv.price})
                                </option>
                              ))}
                            </select>
                          </div>

                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                              <label className="block text-xs font-semibold uppercase text-[#1C1917] mb-1">
                                Preferred Date *
                              </label>
                              <input
                                type="date"
                                name="preferredDate"
                                min={todayStr}
                                value={formData.preferredDate}
                                onChange={handleInputChange}
                                className="w-full px-4 py-3 rounded-xl bg-[#F3EDE4] border border-[#E6DEC8] text-sm text-[#1C1917]"
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-semibold uppercase text-[#1C1917] mb-1">
                                Preferred Time Window
                              </label>
                              <select
                                name="timeSlot"
                                value={formData.timeSlot}
                                onChange={handleInputChange}
                                className="w-full px-4 py-3 rounded-xl bg-[#F3EDE4] border border-[#E6DEC8] text-sm text-[#1C1917]"
                              >
                                <option value="Morning (10:00 AM – 12:30 PM)">Morning (10:00 AM – 12:30 PM)</option>
                                <option value="Afternoon (12:30 PM – 4:00 PM)">Afternoon (12:30 PM – 4:00 PM)</option>
                                <option value="Evening (4:00 PM – 8:00 PM)">Evening (4:00 PM – 8:00 PM)</option>
                              </select>
                            </div>
                          </div>

                          <CreepyButton type="submit" theme="roseBronze" className="w-full" disabled={isSubmitting}>
                            <span>{isSubmitting ? 'Preparing...' : 'Confirm Appointment Request →'}</span>
                          </CreepyButton>
                        </form>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* FOOTER */}
            <footer className="bg-[#171412] text-[#FAF7F2] py-16">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-4">
                <span className="font-serif-editorial text-3xl tracking-[0.16em] block">AURA BEAUTY STUDIO</span>
                <span className="font-mono text-[10px] tracking-[0.28em] uppercase text-[#D49B82] block">
                  BY POOJA • VASTRAL, AHMEDABAD
                </span>
                <p className="text-xs text-[#FAF7F2]/60 pt-4">
                  © 2026 Aura Beauty Studio by Pooja | All Rights Reserved
                </p>
              </div>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
